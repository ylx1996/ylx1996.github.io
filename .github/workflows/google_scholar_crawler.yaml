name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    # 16:17 China Standard Time; scheduled runs can be delayed by GitHub.
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Fetch and validate citation data
        env:
          # The Scholar ID is public. An existing secret or repository variable can override it.
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || vars.GOOGLE_SCHOLAR_ID || 'NQ0z_lgAAAAJ' }}
        run: |
          python -m pip install -r google_scholar_crawler/requirements.txt
          python google_scholar_crawler/main.py
      - name: Check out statistics branch
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: scholar-stats
      - name: Publish validated statistics
        working-directory: scholar-stats
        run: |
          cp ../google_scholar_crawler/results/gs_data*.json .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'Citation data unchanged.'
            exit 0
          fi
          git commit -m 'Update Google Scholar citation statistics'
          git push origin HEAD:google-scholar-stats
