---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" role="main">
      {% include sidebar.html %}
    
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    {% include scripts.html %}

    <!-- BibTeX Modal -->
    <div id="bibModal" class="bib-modal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.6);">
      <div style="background:var(--surface, white); margin:10% auto; padding:20px; border-radius:8px; width:90%; max-width:720px; max-height:80vh; overflow:auto; box-shadow:0 4px 20px rgba(0,0,0,0.3);">
        <span class="bib-close" style="float:right; font-size:32px; cursor:pointer; color:#aaa;">&times;</span>
        <h3 style="margin-top:0;">BibTeX Citation</h3>
        <pre id="bibContent" style="background:var(--code-bg, #f6f8fa); padding:15px; overflow:auto; white-space:pre-wrap; font-family:monospace;"><code></code></pre>
        <button id="copyBib" style="margin-top:10px; padding:8px 16px; background:var(--primary, #9f7aea); color:white; border:none; border-radius:4px; cursor:pointer;">Copy to Clipboard</button>
      </div>
    </div>

    <script src="{{ '/assets/js/bib-modal.js' | relative_url }}"></script>

  </body>
</html>
