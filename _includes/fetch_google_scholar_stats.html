<script>
    $(document).ready(function () {
        // Count the same canonical bibliography used by the Full BibTeX page.
        var paperCount = document.getElementById('publication-count');
        if (paperCount) {
            fetch({{ '/files/lxyang-260205.bib' | relative_url | jsonify }}, { cache: 'no-cache' })
                .then(function (response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.text();
                })
                .then(function (text) {
                    var entries = text.match(/^@(?:inproceedings|article|misc)\s*\{/gim) || [];
                    if (!entries.length) throw new Error('No bibliography entries.');
                    paperCount.textContent = entries.length + '+ ';
                })
                .catch(function () {
                    // Keep the grammatical sentence without a count when unavailable.
                    console.warn('Bibliography count could not be loaded.');
                });
        }

        // Publish validated data with the site; no third-party request on page load.
        var data = {{ site.data.scholar | jsonify }};
        var scholarUrl = {{ site.author.googlescholar | jsonify }};
        var expectedId = new URL(scholarUrl).searchParams.get('user');
        (function (data) {
            if (!data) return;
            var publications = data.publications || {};
            var paperIds = Object.keys(publications);
            // Reject legacy template data even when its top-level ID was edited.
            if (data.scholar_id !== expectedId ||
                !Number.isInteger(data.citedby) || data.citedby < 0 ||
                paperIds.some(function (id) { return id.indexOf(expectedId + ':') !== 0; })) {
                console.warn('Google Scholar statistics failed author validation.');
                return;
            }
            var badge = document.getElementById('google-scholar-citations');
            if (badge) {
                badge.setAttribute('aria-label', 'Google Scholar citations: ' + data.citedby);
                badge.title = 'Google Scholar; updated ' + data.updated;
            }
            var total = document.getElementById('total_cit');
            if (total) total.textContent = data.citedby;
            Array.prototype.forEach.call(document.getElementsByClassName('show_paper_citations'), function (element) {
                var paper = publications[element.getAttribute('data')];
                if (paper && Number.isInteger(paper.num_citations) && paper.num_citations >= 0) {
                    element.textContent = '| Citations: ' + paper.num_citations;
                }
            });
        }(data));
    });
</script>
